name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: nowslide

jobs:
  # CI
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test --no-daemon

  # CD
  deploy:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile.prod \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push .


      - name: Encode compose file
        id: compose
        run: echo "value=$(base64 -w0 compose.prod.yaml)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          COMPOSE_B64: ${{ steps.compose.outputs.value }}
        run: |
          set -euo pipefail

          PARAMS=$(jq -n \
            --arg reg "$REGISTRY" \
            --arg tag "$IMAGE_TAG" \
            --arg region "$AWS_REGION" \
            --arg b64 "$COMPOSE_B64" \
            '{
              commands: [
                "set -euo pipefail",
                "cd /home/ec2-user/qnow",
                "echo \($b64 | @sh) | base64 -d > compose.prod.yaml",
                "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($reg)",
                "check_health() { for i in $(seq 1 40); do curl -sf http://localhost:8081/actuator/health >/dev/null && return 0; sleep 5; done; return 1; }",
                "PREV_IMAGE=$(docker inspect qnow-app --format \"{{.Config.Image}}\" 2>/dev/null || true)",
                "export IMAGE_TAG=\($tag)",
                "docker compose -f compose.prod.yaml --env-file .env.prod pull",
                "docker compose -f compose.prod.yaml --env-file .env.prod up -d --remove-orphans",
                "if check_health; then echo healthy; exit 0; fi",
                "echo health check failed",
                "docker compose -f compose.prod.yaml --env-file .env.prod ps",
                "aws logs tail /qnow/app --since 5m --region ap-northeast-2 || true",
                "PREV_TAG=${PREV_IMAGE##*:}",
                "if [ -n \"$PREV_IMAGE\" ] && [ \"$PREV_TAG\" != \"$IMAGE_TAG\" ]; then",
                "  echo rolling back to \"$PREV_TAG\"",
                "  export IMAGE_TAG=$PREV_TAG",
                "  docker compose -f compose.prod.yaml --env-file .env.prod up -d --remove-orphans",
                "  if check_health; then echo rollback succeeded, previous version restored; else echo rollback health check also failed; fi",
                "else",
                "  echo no previous image to roll back to",
                "fi",
                "exit 1"
              ],
              executionTimeout: ["900"]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "qnow deploy" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)

          echo "command id: $COMMAND_ID"

          sleep 5

          STATUS=Pending
          QUERY_FAILURES=0
          for _ in $(seq 1 120); do
            if STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null); then
              QUERY_FAILURES=0
            else
              QUERY_FAILURES=$((QUERY_FAILURES + 1))
              if [ "$QUERY_FAILURES" -ge 20 ]; then
                echo "스크립트 실행 확인 20회 실패"
                exit 1
              fi
              STATUS=Pending
            fi
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            echo "deploy failed: $STATUS"
            exit 1
          fi
