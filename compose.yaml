services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    command: ["./gradlew", "bootRun", "--no-daemon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qnow
      SPRING_DATASOURCE_USERNAME: qnow
      SPRING_DATASOURCE_PASSWORD: qnow
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      QNOW_S3_BUCKET: ${QNOW_S3_BUCKET}
      QNOW_S3_KEY_PREFIX: ${QNOW_S3_KEY_PREFIX:-presentations}
      QNOW_S3_UPLOAD_URL_EXPIRES_SECONDS: ${QNOW_S3_UPLOAD_URL_EXPIRES_SECONDS:-600}
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - gradle-cache:/home/gradle/.gradle
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qnow
      POSTGRES_USER: qnow
      POSTGRES_PASSWORD: qnow
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qnow -d qnow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  gradle-cache:
  postgres-data:
  redis-data:
