spring:
  application:
    name: qnow
  modulith:
    detection-strategy: explicitly-annotated
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/qnow}
    username: ${SPRING_DATASOURCE_USERNAME:qnow}
    password: ${SPRING_DATASOURCE_PASSWORD:qnow}
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,modulith,prometheus

aws:
  region: ${AWS_REGION:ap-northeast-2}

qnow:
  presenter-view:
    ttl: ${QNOW_PRESENTER_VIEW_TTL:24h}
    channel: ${QNOW_PRESENTER_VIEW_CHANNEL:qnow:presenter-view:events}
    realtime-enabled: ${QNOW_PRESENTER_VIEW_REALTIME_ENABLED:true}
  websocket:
    allowed-origins: ${QNOW_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    s3:
      bucket: ${S3_BUCKET:}
      upload-url-expires-seconds: ${S3_UPLOAD_URL_EXPIRES_SECONDS:600}
      thumbnail-url-expires-seconds: ${S3_THUMBNAIL_URL_EXPIRES_SECONDS:600}
      pdf-url-expires-seconds: ${S3_PDF_URL_EXPIRES_SECONDS:600}
