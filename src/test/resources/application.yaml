spring:
  modulith:
    detection-strategy: explicitly-annotated
  datasource:
    url: jdbc:h2:mem:qnow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379

aws:
  region: ${AWS_REGION:ap-northeast-2}

qnow:
  email-verification:
    sender: local
    code-ttl: 5m
    verified-ttl: 30m
    request-cooldown: 1m
    request-limit-window: 1h
    request-limit: 5
    max-attempts: 5
  presenter-view:
    realtime-enabled: false
  storage:
    s3:
      bucket: qnow-test-bucket
